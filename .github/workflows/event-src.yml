{"name": "event-src", "on": {"push": {"branches": ["event-*"], "paths": ["src/**"]}, "pull_request": {"branches": ["main"], "paths": ["src/**"]}}, "permissions": {}, "jobs": {"observe": {"runs-on": "ubuntu-latest", "timeout-minutes": 2, "steps": [{"run": "printf \"EVENT=%s SHA=%s REF=%s\\n\" \"$GITHUB_EVENT_NAME\" \"$GITHUB_SHA\" \"$GITHUB_REF\""}]}}}